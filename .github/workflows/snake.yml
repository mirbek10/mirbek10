# Положи этот файл в репозиторий профиля по пути:
#   .github/workflows/snake.yml
# Он раз в 12 часов рисует «змейку», поедающую твой график коммитов.

name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#10b981&color_dots=#161b22,#064e3b,#047857,#059669,#10b981
            dist/snake-light.svg?color_snake=#10b981

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
