<svg xmlns="http://www.w3.org/2000/svg" width="380" height="210" viewBox="0 0 380 210" fill="none">
<style>
  .t{font:600 18px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif;fill:#10b981}
  .l{font:400 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif;fill:#e5e7eb}
  .m{font:400 12px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif;fill:#6b7280}
  .v{font:700 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif;fill:#e5e7eb}
  .big{font:700 28px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif;fill:#e5e7eb}
  .fade{opacity:0;animation:f .6s ease forwards}
  @keyframes f{to{opacity:1}}
</style>
<rect x="0.5" y="0.5" width="379" height="209" rx="12" fill="#0d1117" stroke="#1f2937"/>

<line x1="126" y1="40" x2="126" y2="170" stroke="#1f2937"/><line x1="254" y1="40" x2="254" y2="170" stroke="#1f2937"/>
<g class="fade">
    <text x="64" y="108" text-anchor="middle" class="big" >173</text>
    <text x="64" y="138" text-anchor="middle" class="l" >Contributions</text></g>
<circle cx="190" cy="102" r="40" stroke="#10b981" stroke-width="5"/>
  <path d="M190 48c-6 8-12 10-12 18a12 12 0 0 0 24 0c0-8-6-10-12-18Z" fill="#10b981" stroke="#0d1117" stroke-width="3" transform="translate(0,-14)"/><g class="fade">
    <text x="190" y="112" text-anchor="middle" class="big" style="fill:#10b981">0</text>
    <text x="190" y="168" text-anchor="middle" class="v" style="fill:#10b981">Current Streak</text></g>
<g class="fade">
    <text x="316" y="108" text-anchor="middle" class="big" >5</text>
    <text x="316" y="138" text-anchor="middle" class="l" >Longest Streak</text></g>
<text x="190" y="196" text-anchor="middle" class="m">last 12 months</text>
</svg>